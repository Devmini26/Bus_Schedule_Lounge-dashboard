<section class="login">
  <h2>Login</h2>
  <form (ngSubmit)="submit()">
    <label>
      Username
      <input [(ngModel)]="username" name="username" />
    </label>
    <label>
      Password
      <input type="password" [(ngModel)]="password" name="password" />
    </label>
    <button type="submit">Login</button>
  </form>
</section>
