<div class="dashboard-page">
  <app-header></app-header>

  <div class="dashboard-content">
    <div class="page-title">Arrival Management</div>

    <div class="search-container">
      <input type="text" class="search-input" placeholder="Search Arrivals by lounge" [(ngModel)]="searchTerm">
    </div>

    <div class="lounges-container">
      <section class="lounge-section" *ngFor="let lounge of filteredLounges">
        <h2 class="lounge-title">{{ lounge.name }}</h2>
        <div class="table-wrapper">
          <table class="arrivals-table">
            <thead>
              <tr>
                <th>TIME</th>
                <th>BUS NO</th>
                <th>ROUTE NUMBER</th>
                <th>ORIGIN</th>
                <th>REMARKS</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let arrival of lounge.arrivals" [class.active-row]="arrival.active">
                <td><span *ngIf="arrival.active" class="indicator"></span>{{ arrival.time }}</td>
                <td>{{ arrival.busNo }}</td>
                <td>{{ arrival.routeNumber }}</td>
                <td>{{ arrival.origin }}</td>
                <td><span *ngIf="arrival.statusText" class="status" [ngClass]="arrival.status">{{ arrival.statusText }}</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>
