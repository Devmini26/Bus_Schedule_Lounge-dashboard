<div class="dashboard-page">
  <app-header></app-header>

  <div class="dashboard-content">
    <section class="stats-cards">
    <div class="stat-card">
      <div class="stat-label">Today<br>Departure</div>
      <div class="stat-value">30</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Today<br>Arrivals</div>
      <div class="stat-value">20</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Delayed<br>Arrivals</div>
      <div class="stat-value">01</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Delayed<br>Departures</div>
      <div class="stat-value">01</div>
    </div>
  </section>

  <div class="page-title">Departure Management</div>

  <div class="search-container">
    <input type="text" class="search-input" placeholder="Search Departures for lounge..............." [(ngModel)]="searchTerm">
  </div>

  <div class="lounges-container">
    <section class="lounge-section" *ngFor="let lounge of filteredLounges">
      <h2 class="lounge-title">{{ lounge.name }}</h2>
      <div class="table-wrapper">
        <table class="departures-table">
          <thead>
            <tr>
              <th>TIME</th>
              <th>BUS NO</th>
              <th>Route Number</th>
              <th>DESTINATION</th>
              <th>REMARKS</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let departure of lounge.departures" [class.active-row]="departure.active">
              <td><span *ngIf="departure.active" class="indicator"></span>{{ departure.time }}</td>
              <td>{{ departure.busNo }}</td>
              <td>{{ departure.routeNumber }}</td>
              <td>{{ departure.destination }}</td>
              <td><span *ngIf="departure.statusText" class="status" [ngClass]="departure.status">{{ departure.statusText }}</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
  </div>
</div>
